<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Scraping at scale. AI integration. And the infrastructure that keeps both running. Technical lead, Andalusia, Spain.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#162338"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1000" height="250" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="250" rx="18" fill="url(#dots)"/>
  <circle cx="120" cy="230" r="190" fill="url(#glowA)"/>
  <circle cx="900" cy="20" r="190" fill="url(#glowB)"/>
  <rect x="0.5" y="0.5" width="999" height="249" rx="17.5" fill="none" stroke="#30363d"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="500" y="98" font-size="46" font-weight="700" fill="url(#accent)">Scraping at scale. AI integration.</text>
    <text x="500" y="144" font-size="23" fill="#c9d1d9">and the infrastructure that keeps both running</text>
    <rect x="440" y="170" width="120" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="500" y="208" font-size="16" letter-spacing="1.5" fill="#8b949e">TECHNICAL LEAD  /  ANDALUSIA, SPAIN  /  REMOTE, HYBRID OR ON-SITE</text>
  </g>
</svg>
